<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>AFAIC — animated logo reveal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0B2216}
#bg{position:absolute;inset:0;background:radial-gradient(ellipse 62% 66% at 50% 50%,#174A31 0%,#0F2E1E 48%,#081A10 100%)}
#glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(169,210,150,.22) 0%,rgba(169,210,150,0) 38%);mix-blend-mode:screen}
.mote{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(220,245,210,.9) 0%,rgba(169,210,150,.3) 45%,rgba(169,210,150,0) 70%);mix-blend-mode:screen}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse 80% 80% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.5) 100%)}
svg{position:absolute;left:0;top:0;overflow:visible}
</style></head><body>
<div id="bg"></div><div id="glow"></div><div id="motes"></div>
<svg id="stage" width="1920" height="1080"><defs id="defs"></defs></svg>
<div id="vig"></div>

<script src="../engine.js"></script>
<script src="../logo-geom.js"></script>
<script src="../logo-anim.js"></script>
<script>
const $ = s => document.querySelector(s);

// the shared logo reveal (logo-anim.js): 1100 px lockup centred on screen, in brand colours
const REVEAL = createLogoReveal($('#stage'), $('#defs'), { cx: 960, cy: 540, width: 1100, id: 'brand' });

// soft motes
let seed = 3; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const MOTES = [];
for (let i = 0; i < 26; i++) { const d = document.createElement('div'); d.className = 'mote'; const s = 4 + rnd() * 18; d.style.width = d.style.height = s + 'px';
  $('#motes').appendChild(d); MOTES.push({ d, x: rnd() * 1920, y: rnd() * 1080, sp: 6 + rnd() * 14, ph: rnd() * 6.28 }); }

setup([], 6.0, t => {
  const m = REVEAL.update(t);

  $('#glow').style.opacity = (E.inOutSine(P(t, 0.2, 2.6)) * (1 - 0.5 * m)).toFixed(3);
  for (const o of MOTES) {
    const yy = ((o.y - t * o.sp) % 1140 + 1140) % 1140 - 30, xx = o.x + Math.sin(t * 0.5 + o.ph) * 20;
    o.d.style.transform = `translate3d(${xx.toFixed(1)}px,${yy.toFixed(1)}px,0)`;
    o.d.style.opacity = ((0.2 + 0.4 * (0.5 + 0.5 * Math.sin(t * 1.6 + o.ph))) * P(t, 0.2, 1.5)).toFixed(3);
  }
});
</script>
</body></html>
