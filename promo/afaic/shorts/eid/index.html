<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>AFAIC — Eid Mubarak</title>
<style>
@font-face{font-family:'Fraunces';src:url(../../fonts/Fraunces.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:'Fraunces';src:url(../../fonts/Fraunces-Italic.woff2) format('woff2');font-weight:100 900;font-style:italic}
@font-face{font-family:'Amiri';src:url(../../fonts/Amiri-400-arabic.woff2) format('woff2');font-weight:400}
@font-face{font-family:'Amiri';src:url(../../fonts/Amiri-700-arabic.woff2) format('woff2');font-weight:700}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0A3428}
body{font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased;color:#F3E6C4}
#bg{position:absolute;inset:0;background:radial-gradient(ellipse 75% 75% at 50% 50%,#0F4A38 0%,#0A3428 55%,#06231B 100%)}
svg{position:absolute;left:0;top:0;overflow:visible}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse 60% 60% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.45) 100%)}
.center{position:absolute;left:460px;width:1000px;text-align:center}
.serif{font-family:Fraunces,serif;font-optical-sizing:auto}
.ar{font-family:Amiri,serif;direction:rtl;color:#D9B65E}
.cap{font:600 17px/1 Inter;letter-spacing:.34em;text-transform:uppercase;color:#C9A44C}
.lantern{position:absolute;top:-10px;transform-origin:50% 0}
#fade{position:absolute;inset:0;background:#06231B;z-index:50}
.dust{position:absolute;width:5px;height:5px;border-radius:50%;background:#F1D58A;box-shadow:0 0 8px 2px rgba(241,213,138,.6)}
</style></head><body>
<div id="bg"></div>
<svg id="pat" width="1920" height="1080"></svg>
<div id="dustwrap"></div>
<div id="vig"></div>

<!-- lanterns -->
<svg class="lantern" id="lanL" width="180" height="560" style="left:190px" viewBox="0 0 180 560"></svg>
<svg class="lantern" id="lanR" width="180" height="470" style="left:1550px" viewBox="0 0 180 470"></svg>

<!-- medallion -->
<svg id="med" width="1920" height="1080">
  <rect x="440" y="200" width="1040" height="680" fill="#0A3428" fill-opacity=".94" id="medfill"/>
  <rect class="frame" x="440" y="200" width="1040" height="680" fill="none" stroke="#C9A44C" stroke-width="3"/>
  <rect class="frame" x="460" y="220" width="1000" height="640" fill="none" stroke="#C9A44C" stroke-width="1.5" stroke-opacity=".7"/>
  <g id="corners"></g>
</svg>

<!-- crescent -->
<svg id="moon" width="1920" height="1080">
  <defs><radialGradient id="mg"><stop offset="0" stop-color="#F6DE97" stop-opacity=".5"/><stop offset="1" stop-color="#F6DE97" stop-opacity="0"/></radialGradient>
  <mask id="cres"><rect x="0" y="0" width="1920" height="1080" fill="#fff"/><circle cx="978" cy="282" r="34" fill="#000"/></mask></defs>
  <circle cx="960" cy="290" r="90" fill="url(#mg)"/>
  <circle cx="960" cy="290" r="40" fill="#E9C46A" mask="url(#cres)"/>
  <path d="M1010 262 l4 10 10 1 -8 6 3 10 -9 -6 -9 6 3 -10 -8 -6 10 -1z" fill="#E9C46A"/>
</svg>

<!-- card 1: Eid Mubarak -->
<div class="center ar" id="arT" style="top:360px;font-size:150px;line-height:1.1">عید مبارک</div>
<div class="center serif" id="enT" style="top:560px;font-size:96px;font-style:italic;font-weight:330;letter-spacing:-.02em">Eid Mubarak</div>
<svg id="orn" width="1920" height="1080"><g transform="translate(960 715)"><line x1="-260" y1="0" x2="-30" y2="0" stroke="#C9A44C" stroke-width="2"/><line x1="30" y1="0" x2="260" y2="0" stroke="#C9A44C" stroke-width="2"/><rect x="-11" y="-11" width="22" height="22" transform="rotate(45)" fill="none" stroke="#C9A44C" stroke-width="2"/><circle r="4" fill="#C9A44C"/></g></svg>

<!-- card 2: message -->
<div class="center serif msg" style="top:390px;font-size:58px;font-weight:330;letter-spacing:-.015em">May this Eid fill your home with <i>peace,</i></div>
<div class="center serif msg" style="top:490px;font-size:58px;font-weight:330;letter-spacing:-.015em">your table with <i>loved ones,</i></div>
<div class="center serif msg" style="top:590px;font-size:58px;font-weight:330;letter-spacing:-.015em">and your heart with <i>hope.</i></div>

<!-- card 3: Dari + Pashto -->
<div class="center ar" id="dari" style="top:350px;font-size:96px">عید شما مبارک</div>
<div class="center ar" id="pashto" style="top:480px;font-size:84px;color:#E8D8A8">اختر مو مبارک شه</div>
<div class="center serif" id="fam" style="top:650px;font-size:50px;font-style:italic;font-weight:320">From our family to yours.</div>

<!-- card 4: sign-off -->
<img id="logo" src="../../assets/logo_rev.svg" style="position:absolute;left:705px;top:420px;width:510px">
<div class="center cap" id="org" style="top:640px">Afghan Fajar Association Inc.</div>
<div class="center" id="url" style="top:690px;font:500 22px Inter;letter-spacing:.12em;color:#E8D8A8">afaic.org.au · Campbelltown NSW</div>

<div id="fade"></div>
<script src="../engine.js"></script>
<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const NS = 'http://www.w3.org/2000/svg';

// ---------- 8-point star tessellation (drawn outward from the centre)
const pat = $('#pat'), STARS = [];
const S = 132;
for (let row = -1; row < 10; row++) for (let col = -1; col < 16; col++) {
  const cx = col * S + (row % 2 ? S / 2 : 0) + 30, cy = row * S * 0.866 + 20;
  const pts = []; for (let k = 0; k < 16; k++) { const a = k * Math.PI / 8 + Math.PI / 16, r = k % 2 ? 24 : 52; pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); }
  const poly = document.createElementNS(NS, 'polygon');
  poly.setAttribute('points', pts.map(p => p.map(v => v.toFixed(1)).join(',')).join(' '));
  poly.setAttribute('fill', 'none'); poly.setAttribute('stroke', '#C9A44C'); poly.setAttribute('stroke-width', '1.6'); poly.setAttribute('stroke-opacity', '.55');
  let len = 0; for (let k = 0; k < 16; k++) { const a = pts[k], b = pts[(k + 1) % 16]; len += Math.hypot(a[0] - b[0], a[1] - b[1]); }
  poly.setAttribute('stroke-dasharray', len.toFixed(1));
  const dot = document.createElementNS(NS, 'rect');
  dot.setAttribute('x', cx - 9); dot.setAttribute('y', cy - 9); dot.setAttribute('width', 18); dot.setAttribute('height', 18);
  dot.setAttribute('transform', `rotate(45 ${cx} ${cy})`); dot.setAttribute('fill', '#1E6A50');
  pat.appendChild(dot); pat.appendChild(poly);
  const d = Math.hypot(cx - 960, cy - 540);
  STARS.push({ poly, dot, len, t0: 0.2 + d / 1100 * 2.4 });
}

// medallion corner ornaments
const cg = $('#corners');
[[440, 200], [1480, 200], [440, 880], [1480, 880]].forEach(([x, y]) => {
  cg.insertAdjacentHTML('beforeend', `<g transform="translate(${x} ${y})"><rect x="-16" y="-16" width="32" height="32" transform="rotate(45)" fill="#0A3428" stroke="#C9A44C" stroke-width="2.5"/><circle r="5" fill="#C9A44C"/></g>`);
});
const frames = $$('.frame');
frames.forEach(f => { const L = 2 * (+f.getAttribute('width') + +f.getAttribute('height')); f.setAttribute('stroke-dasharray', L); f.dataset.len = L; });

// lanterns
function lantern(svg, len) {
  svg.innerHTML = `<defs><radialGradient id="g${svg.id}" cx="50%" cy="55%" r="60%"><stop offset="0" stop-color="#FFE7A3"/><stop offset=".55" stop-color="#F2A93B"/><stop offset="1" stop-color="#B8641A"/></radialGradient>
   <radialGradient id="h${svg.id}"><stop offset="0" stop-color="#FFD27A" stop-opacity=".55"/><stop offset="1" stop-color="#FFD27A" stop-opacity="0"/></radialGradient></defs>
   <line x1="90" y1="0" x2="90" y2="${len}" stroke="#C9A44C" stroke-width="2"/>
   <g transform="translate(0 ${len})">
     <circle cx="90" cy="95" r="120" fill="url(#h${svg.id})"/>
     <circle cx="90" cy="6" r="8" fill="none" stroke="#C9A44C" stroke-width="3"/>
     <path d="M60 30 Q90 0 120 30 Z" fill="#C9A44C"/>
     <rect x="54" y="30" width="72" height="10" fill="#B08A3A"/>
     <path d="M58 40 L122 40 L134 70 L134 140 L122 168 L58 168 L46 140 L46 70 Z" fill="url(#g${svg.id})" stroke="#C9A44C" stroke-width="4"/>
     <path d="M90 40 V168 M46 104 H134 M58 40 L46 70 M122 40 L134 70 M46 140 L58 168 M134 140 L122 168" stroke="#8C6A24" stroke-width="3" fill="none"/>
     <path d="M70 70 Q90 50 110 70 L110 138 L70 138 Z" fill="#FFF3C9" fill-opacity=".35"/>
     <rect x="54" y="168" width="72" height="10" fill="#B08A3A"/>
     <path d="M66 178 L114 178 L90 210 Z" fill="#C9A44C"/>
     <line x1="90" y1="210" x2="90" y2="232" stroke="#C9A44C" stroke-width="2"/><circle cx="90" cy="236" r="5" fill="#C9A44C"/>
   </g>`;
}
lantern($('#lanL'), 300); lantern($('#lanR'), 210);

// dust particles
const dw = $('#dustwrap'), DUST = [];
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
for (let i = 0; i < 46; i++) { const d = document.createElement('div'); d.className = 'dust'; dw.appendChild(d);
  DUST.push({ d, x: rnd() * 1920, y: rnd() * 1080, sp: 14 + rnd() * 28, ph: rnd() * 6.28, sz: 0.5 + rnd() * 0.9 }); }

// ---------- timeline
const T = [];
const fadeUp = (t0, d = 1.0, dy = 24) => ({ o: [[t0, 0], [t0 + d, 1, 'outCubic']], y: [[t0, dy], [t0 + d * 1.2, 0, 'outCubic']] });
const fadeOut = (t1, d = 0.8) => ({ o: [[t1, 1], [t1 + d, 0, 'inOutSine']] });

T.push(['#lanL', { y: [[2.6, -620], [5.4, 0, 'outCubic']], fn: (el, t) => el.style.transform += ` rotate(${(Math.sin(t * 1.1) * 3.2).toFixed(3)}deg)` }]);
T.push(['#lanR', { y: [[3.0, -520], [5.8, 0, 'outCubic']], fn: (el, t) => el.style.transform += ` rotate(${(Math.sin(t * 1.1 + 1.4) * 3.6).toFixed(3)}deg)` }]);
T.push(['#medfill', { o: [[3.2, 0], [4.6, 0.94, 'inOutSine']] }]);
T.push(['#corners', { o: [[4.6, 0], [5.4, 1, 'inOutSine']] }]);
T.push(['#moon', M(fadeUp(4.4, 1.4, 30), fadeOut(11.6, 0.8), { o: [[24.6, 0], [25.4, 1]], y: [[24.6, 0], [24.61, 60, 'step']] })]);
T.push(['#arT', { o: [[5.2, 0], [5.3, 1, 'linear'], [11.6, 1], [12.3, 0, 'inOutSine']], clip: [[5.2, [0, 0, 0, 100]], [7.0, [0, 0, 0, 0], 'inOutSine']] }]);
T.push(['#enT', M(fadeUp(7.4, 1.2), fadeOut(11.6, 0.7))]);
T.push(['#orn', { o: [[8.2, 0], [9.0, 1, 'inOutSine'], [11.6, 1], [12.3, 0]], sx: [[8.2, 0.2], [9.2, 1, 'outCubic']] }]);
$('#orn').style.transformOrigin = '960px 715px';
$$('.msg').forEach((m, i) => T.push([m, M(fadeUp(12.6 + i * 1.6, 1.2), fadeOut(19.4, 0.8))]));
T.push(['#dari', { o: [[20.4, 0], [20.5, 1, 'linear'], [24.3, 1], [24.9, 0, 'inOutSine']], clip: [[20.4, [0, 0, 0, 100]], [21.8, [0, 0, 0, 0], 'inOutSine']] }]);
T.push(['#pashto', { o: [[21.4, 0], [21.5, 1, 'linear'], [24.3, 1], [24.9, 0, 'inOutSine']], clip: [[21.4, [0, 0, 0, 100]], [22.8, [0, 0, 0, 0], 'inOutSine']] }]);
T.push(['#fam', M(fadeUp(22.6, 1.1), fadeOut(24.3, 0.6))]);
T.push(['#logo', M(fadeUp(25.2, 1.3, 20), { s: [[25.2, 0.96], [27.0, 1, 'outCubic']] })]);
T.push(['#org', fadeUp(26.0, 1.0, 14)]);
T.push(['#url', fadeUp(26.4, 1.0, 14)]);
T.push(['#fade', { o: [[0, 1], [1.2, 0, 'inOutSine'], [29.0, 0], [30.0, 1, 'inOutSine']] }]);

setup(T, 30, t => {
  // pattern draws outward, then breathes
  for (const s of STARS) {
    const p = E.inOutSine(P(t, s.t0, 1.4));
    s.poly.style.strokeDashoffset = (s.len * (1 - p)).toFixed(1);
    s.dot.style.opacity = (E.outCubic(P(t, s.t0 + 0.6, 1.0)) * (0.75 + 0.25 * Math.sin(t * 0.9 + s.t0 * 3))).toFixed(3);
  }
  $('#pat').style.transform = `scale(${(1.04 - 0.04 * P(t, 0, 30)).toFixed(4)}) rotate(${(0.6 * P(t, 0, 30)).toFixed(3)}deg)`;
  $('#pat').style.transformOrigin = '960px 540px';
  frames.forEach((f, i) => { const p = E.inOutSine(P(t, 3.4 + i * 0.3, 1.8)); f.style.strokeDashoffset = (f.dataset.len * (1 - p)).toFixed(1); });
  for (const d of DUST) {
    const y = ((d.y - t * d.sp) % 1180 + 1180) % 1180 - 50, x = d.x + Math.sin(t * 0.6 + d.ph) * 24;
    d.d.style.transform = `translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,0) scale(${d.sz.toFixed(2)})`;
    d.d.style.opacity = ((0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 2.1 + d.ph * 2))) * P(t, 1.0, 2.0)).toFixed(3);
  }
});
</script>
</body></html>
